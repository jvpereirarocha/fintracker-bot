# Copy to k8s/bot-secrets.yaml (ignored by git) and fill in the values
apiVersion: v1
kind: Secret
metadata:
  name: fintracker-bot-secrets
  namespace: fintracker-dev
type: Opaque
stringData:
  TELEGRAM_BOT_TOKEN: "your_bot_token"
  TELEGRAM_ALLOWED_USER_ID: "123456789"
  FINTRACKER_USERNAME: "your_fintracker_username"
  FINTRACKER_PASSWORD: "your_fintracker_password"
  ANTHROPIC_API_KEY: "your_anthropic_api_key"
